spring:
  application:
    name: isnote

  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: AIzaSyDauyY2otltj6WAOCPwFW_tiG2WrJQpIAw
        chat:
          options:
            model: gemini-2.5-flash

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:isnote}
    username: ${DB_USER:isnote}
    password: ${DB_PASSWORD:isnote_dev_secret}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

isnote:
  cors:
    allowed-origins: ${ISNOTE_CORS_ALLOWED_ORIGINS:http://localhost:5173,tauri://localhost}
  auth:
    jwt:
      issuer: ${JWT_ISSUER:isnote}
      secret: ${JWT_SECRET:change-me-in-production-change-me-in-production-change-me}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
