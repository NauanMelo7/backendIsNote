spring:
  application:
    name: isnote

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:isnote}
    username: ${DB_USER:isnote}
    password: ${DB_PASSWORD:isnote_dev_secret}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

isnote:
  auth:
    jwt:
      issuer: ${JWT_ISSUER:isnote}
      secret: ${JWT_SECRET:change-me-in-production-change-me-in-production-change-me}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
